name: Compile LaTeX and Upload to Drive 2.0

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Compile LaTeX
        uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex

      - name: Install Google client library
        run: pip install google-api-python-client google-auth-oauthlib

      - name: Upload PDF to Google Drive
        env:
          GDRIVE_REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
          GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
          GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
        run: |
          python3 << 'EOF'
          import os
          from google.oauth2.credentials import Credentials
          from googleapiclient.discovery import build
          from googleapiclient.http import MediaFileUpload
          creds = Credentials(
              token=None,
              refresh_token=os.environ["GDRIVE_REFRESH_TOKEN"],
              client_id=os.environ["GDRIVE_CLIENT_ID"],
              client_secret=os.environ["GDRIVE_CLIENT_SECRET"],
              token_uri="https://oauth2.googleapis.com/token"
          )
          service = build("drive", "v3", credentials=creds)
          folder_id = os.environ["GDRIVE_FOLDER_ID"]
          results = service.files().list(
              q=f"name='main.pdf' and '{folder_id}' in parents and trashed=false",
              fields="files(id, name)"
          ).execute()
          files = results.get("files", [])
          media = MediaFileUpload("main.pdf", mimetype="application/pdf")
          if files:
              service.files().update(
                  fileId=files[0]["id"],
                  media_body=media
              ).execute()
              print("PDF actualizado en Drive")
          else:
              service.files().create(
                  body={"name": "main.pdf", "parents": [folder_id]},
                  media_body=media
              ).execute()
              print("PDF subido a Drive")
          EOF

      - name: Delete existing release
        run: |
          gh release delete latest-pdf --yes || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create release and upload PDF
        run: |
          gh release create latest-pdf main.pdf \
            --title "Tesis PDF" \
            --notes "PDF compilado automáticamente" \
            --latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare PDF for Pages
        run: |
          mkdir -p public
          cp main.pdf public/main.pdf

      - name: Deploy PDF to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public

      - name: Upload PDF to Cloudflare R2
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
        run: |
          pip install boto3
          python3 << 'EOF'
          import os
          import boto3

          s3 = boto3.client(
              "s3",
              endpoint_url=f"https://{os.environ['R2_ACCOUNT_ID']}.r2.cloudflarestorage.com",
              aws_access_key_id=os.environ["R2_ACCESS_KEY_ID"],
              aws_secret_access_key=os.environ["R2_SECRET_ACCESS_KEY"],
              region_name="auto"
          )

          s3.upload_file(
              "main.pdf",
              "tesis-pdf",
              "main.pdf",
              ExtraArgs={"ContentType": "application/pdf"}
          )
          print("PDF subido a R2")
          EOF
