name: Compile LaTeX and Upload to Drive

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Compile LaTeX
        uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex

      - name: Install Google client library
        run: pip install google-api-python-client google-auth-oauthlib

      - name: Upload PDF to Google Drive
        env:
          GDRIVE_REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
          GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
          GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
        run: |
          python3 << 'EOF'
          import os
          from google.oauth2.credentials import Credentials
          from googleapiclient.discovery import build
          from googleapiclient.http import MediaFileUpload

          creds = Credentials(
              token=None,
              refresh_token=os.environ["GDRIVE_REFRESH_TOKEN"],
              client_id=os.environ["GDRIVE_CLIENT_ID"],
              client_secret=os.environ["GDRIVE_CLIENT_SECRET"],
              token_uri="https://oauth2.googleapis.com/token"
          )

          service = build("drive", "v3", credentials=creds)
          folder_id = os.environ["GDRIVE_FOLDER_ID"]

          results = service.files().list(
              q=f"name='main.pdf' and '{folder_id}' in parents and trashed=false",
              fields="files(id, name)"
          ).execute()

          files = results.get("files", [])
          media = MediaFileUpload("main.pdf", mimetype="application/pdf")

          if files:
              service.files().update(
                  fileId=files[0]["id"],
                  media_body=media
              ).execute()
              print("PDF actualizado en Drive")
          else:
              service.files().create(
                  body={"name": "main.pdf", "parents": [folder_id]},
                  media_body=media
              ).execute()
              print("PDF subido a Drive")
          EOF
